name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/GuideDeck.Tests -c Release
      - run: python3 scripts/check-theme-contrast.py
      - run: python3 -B scripts/test-release-validation.py
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Build desktop and Game Bar companion package
        shell: powershell
        run: ./scripts/build-windows.ps1 -IncludeGameBar
      - name: Desktop startup smoke test
        shell: powershell
        run: ./scripts/smoke-desktop.ps1
      - name: Single-file companion startup smoke test
        shell: powershell
        run: ./scripts/smoke-desktop.ps1 -Executable src/GuideDeck.GameBar/Companion/GuideDeck.exe
      - name: Render light and dark UI previews
        shell: powershell
        run: ./scripts/capture-ui.ps1
      - name: Verify live system theme updates
        shell: powershell
        run: ./scripts/test-system-theme.ps1
      - name: Installer offline smoke test
        shell: powershell
        run: |
          $bad = Join-Path $env:TEMP 'guidedeck-bad-checksum.txt'
          ('0' * 64) + '  GuideDeck-windows-x64.zip' | Set-Content $bad
          $rejected = $false
          try { ./scripts/Install-GuideDeck.ps1 -ArchivePath artifacts/GuideDeck-windows-x64.zip -ChecksumFile $bad -SkipShortcut } catch { $rejected = $true }
          if (-not $rejected) { throw 'Installer accepted an incorrect checksum.' }
          ./scripts/Install-GuideDeck.ps1 -ArchivePath artifacts/GuideDeck-windows-x64.zip -ChecksumFile artifacts/SHA256SUMS.txt -SkipShortcut
          ./scripts/Install-GuideDeck.ps1 -ArchivePath artifacts/GuideDeck-windows-x64.zip -ChecksumFile artifacts/SHA256SUMS.txt -SkipShortcut
          ./scripts/Uninstall-GuideDeck.ps1
      - name: Installed update, restart, corruption rejection and clean uninstall
        shell: powershell
        run: ./scripts/test-installed-update.ps1
      - name: Upload Windows build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuideDeck-windows
          retention-days: 7
          path: |
            artifacts/GuideDeck-windows-x64.zip
            artifacts/SHA256SUMS.txt
            artifacts/installer/*Setup.exe
            artifacts/installer/*-full.nupkg
            artifacts/installer/releases.win-x64.json
            src/GuideDeck.GameBar/AppPackages/**
          if-no-files-found: warn
      - name: Upload actual UI renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuideDeck-ui-previews
          retention-days: 7
          path: |
            artifacts/ui-previews/
            artifacts/update-test/
          if-no-files-found: warn
